[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "difair"
version = "0.7.0"
description = "Unified differential item functioning and algorithmic fairness auditing for educational data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Ziying Guo" },
  { name = "Yan Li" },
]
maintainers = [{ name = "Yan Li" }]
keywords = ["differential item functioning", "psychometrics", "algorithmic fairness",
            "educational measurement", "learning analytics", "item response theory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.1",
  "statsmodels>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
# Needed only by examples/timss_validation.py, to read SPSS files.
timss = ["pyreadstat>=1.2"]

[project.urls]
Repository = "https://github.com/ZIYINGJERRY/difair"
Issues = "https://github.com/ZIYINGJERRY/difair/issues"

[tool.setuptools.packages.find]
include = ["difair*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning", "ignore::UserWarning"]
