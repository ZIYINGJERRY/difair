name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show resolved dependency versions
        run: python -c "import numpy, pandas, scipy, sklearn, statsmodels, difair; print('difair', difair.__version__); [print(m.__name__, m.__version__) for m in (numpy, pandas, scipy, sklearn, statsmodels)]"

      - name: Run test suite
        run: pytest tests/ -q --cov=difair --cov-report=term-missing

  quickstart:
    name: Quickstart example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run examples/quickstart.py
        run: python examples/quickstart.py
      - name: Check the audit report was written
        run: test -s difair_audit.html
