# ---- Note ----
# validation_results/ and xval_data/ hold the results and data needed to
# reproduce the paper. They are small (a few hundred KB) and are meant to be
# committed, so they are deliberately not ignored here.

# ---- Scratch files written into validation_results/ during a run ----
# examples/realdata_validation.py stages a CSV and a generated R script for the
# Rscript subprocess (_verbal.csv, _verbal.R). They carry absolute paths from
# the machine that produced them, and _verbal.csv is a copy of difR's own
# GPL-licensed verbal aggression data, so neither belongs in this repository.
# The underscore prefix marks anything written for a subprocess rather than
# kept as a result.
validation_results/_*

# ---- Optional outputs, only produced when the source data is available ----
# examples/timss_validation.py writes this when run against TIMSS SPSS files.
validation_results/timss_pooled_items.csv

# ---- Generated by examples/quickstart.py ----
difair_audit.html
